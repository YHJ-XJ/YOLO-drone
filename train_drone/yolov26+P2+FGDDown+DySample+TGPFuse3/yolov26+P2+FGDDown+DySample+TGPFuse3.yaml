# Ultralytics YOLO26 + P2 + FGDDown + DySample + TGPFuse-3Concat
# 实验目的：基于当前最强 E12，只替换 3 个小目标最相关的 Neck Concat。
# 创新点：用 tiny-object prior guided residual fusion 替代普通粗粒度拼接。

nc: 10
scale: n
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # P5 -> P4：保持普通 Concat，不先动大目标/高层语义融合点。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # P4 -> P3：小目标相关融合点 1，替换为 TGPFuse。
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, TGPFuse, [1, -1, 4, 0.1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # P3 -> P2：小目标相关融合点 2，替换为 TGPFuse。
  - [-1, 1, DySample, [2, 4, False]] # 17
  - [[-1, 2], 1, TGPFuse, [1, -1, 4, 0.1]] # 18
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  # P2 -> P3：小目标细节回传融合点 3，替换为 TGPFuse。
  - [-1, 1, FGDDown, [128]] # 20
  - [[-1, 16], 1, TGPFuse, [1, 0, 4, 0.1]] # 21
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  # 其余 PAN 路径保持原 Concat，避免一次替换过多导致变量不干净。
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
