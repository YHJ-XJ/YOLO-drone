# Ultralytics YOLO26 + P2 + FGDDown + DySample
# 实验目的：验证“P2高分辨率检测分支 + 细粒度下采样 + 动态上采样”是否能进一步提升无人机小目标检测精度。
# 变量控制：不启用 NWD，不加入 DCLDown/DAFuseST，避免多个不稳定因素混在一起。

nc: 10 # VisDrone 转 YOLO 后的类别数
scale: n # 使用 YOLO26n 规模，便于和前面 n 模型实验公平比较
end2end: True # 保持 YOLO26 官方端到端检测模式
reg_max: 1 # 保持 YOLO26 官方配置

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  # backbone 保持 YOLO26 官方结构，避免主干变化影响对照。
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # DySample 替换固定 nearest 上采样：P5 -> P4
  # [2, 4, False] 分别表示上采样2倍、4组采样、不启用额外动态门控，先保证实验变量干净。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # DySample 替换固定 nearest 上采样：P4 -> P3
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # 增加 P2 小目标检测分支，并用 DySample 做 P3 -> P2 的动态上采样。
  - [-1, 1, DySample, [2, 4, False]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  # FGDDown 替换 P2 -> P3 回传路径里的普通 stride=2 Conv。
  # 目的：下采样时同时保留空间细节分支和显著特征分支，减少小目标信息丢失。
  - [-1, 1, FGDDown, [128]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
