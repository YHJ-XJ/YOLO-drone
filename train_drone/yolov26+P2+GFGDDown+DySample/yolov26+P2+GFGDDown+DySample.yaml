# Ultralytics YOLO26 + P2 + GFGDDown + DySample
# 实验目的：在当前最优 E12（P2 + FGDDown + DySample）基础上，只把 FGDDown 替换为门控版 GFGDDown。
# 创新点：让 P2->P3 下采样时的“细节分支”和“显著分支”自适应加权，而不是固定拼接。

nc: 10
scale: n
end2end: True
reg_max: 1

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  # backbone 保持 YOLO26 官方结构，避免主干变化影响单变量对照。
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # DySample 替换固定 nearest 上采样：P5 -> P4。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # DySample 替换固定 nearest 上采样：P4 -> P3。
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # 增加 P2 小目标检测分支，并用 DySample 做 P3 -> P2 的动态上采样。
  - [-1, 1, DySample, [2, 4, False]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  # 核心改动：GFGDDown 替换原 E12 中的 FGDDown。
  # GFGDDown 会自适应调节 PixelUnshuffle 细节分支和 Pool 显著分支的贡献。
  - [-1, 1, GFGDDown, [128]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
