# YOLO26n + P2 + FGDDown + DySample + TGPFuse3 + TCA_P3
# 目的：冲精度版本。保留 P2/P3/P4/P5 四个检测头，不进行 P5SPFPrune 剪枝。
# 单变量变化：相对 TGPFuse3，只在 P4->P3 融合后的 P3 特征处加入 TCA。

nc: 10
scale: n
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # P5 -> P4：保留普通 Concat，保留完整顶层语义检测路径。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # P4 -> P3：TGPFuse 替代普通 Concat，是小目标跨尺度融合点 1。
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, TGPFuse, [1, -1, 4, 0.1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # TCA_P3：只增强 P3 小目标敏感层，不干扰 P4/P5 语义层。
  - [-1, 1, TCA, [256, 4, 0.1]] # 17 (P3/8 attention)

  # P3 -> P2：用增强后的 P3 继续向 P2 传播。
  - [-1, 1, DySample, [2, 4, False]] # 18
  - [[-1, 2], 1, TGPFuse, [1, -1, 4, 0.1]] # 19
  - [-1, 2, C3k2, [128, True]] # 20 (P2/4-xsmall)

  # P2 -> P3：FGDDown 负责细节保持下采样，TGPFuse 引用增强后的 P3 特征。
  - [-1, 1, FGDDown, [128]] # 21
  - [[-1, 17], 1, TGPFuse, [1, 0, 4, 0.1]] # 22
  - [-1, 2, C3k2, [256, True]] # 23 (P3/8-small)

  # P3 -> P4：保留原 PAN 路径。
  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 13], 1, Concat, [1]] # 25 cat head P4
  - [-1, 2, C3k2, [512, True]] # 26 (P4/16-medium)

  # P4 -> P5：保留 P5 检测头，用于冲精度，不做剪枝。
  - [-1, 1, Conv, [512, 3, 2]] # 27
  - [[-1, 10], 1, Concat, [1]] # 28 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 29 (P5/32-large)

  - [[20, 23, 26, 29], 1, Detect, [nc]] # 30 Detect(P2, P3, P4, P5)
