  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, TPCCSIM, [512, 8, 0.1]] # 28: P4校准

  - [-1, 1, Conv, [512, 3, 2]]
