# Ultralytics YOLO26 + DySample object detection model.
# 本配置用于做“单变量消融实验”：只把 YOLO26 baseline 颈部的 nearest 上采样替换为 DySample。
# 目的：验证动态采样上采样是否能改善小目标特征恢复与跨尺度融合。

nc: 10 # VisDrone 转 YOLO 后的类别数
scale: n # 使用 n 规模，对应 yolo26n.pt 预训练权重
end2end: True # YOLO26 官方端到端检测模式
reg_max: 1 # YOLO26 官方配置，保持不变以便和 baseline 公平对比

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  # backbone 完全保持 YOLO26 官方 baseline，不加入 P2，也不加入 DCLDown。
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # 原官方：nn.Upsample [None, 2, "nearest"]
  # 修改为：DySample [2, 4, False]
  # 2 表示上采样 2 倍；4 表示分组采样；False 表示暂不开启动态幅度门控，先保持变量简单。
  - [-1, 1, DySample, [2, 4, False]]
  - [[-1, 6], 1, Concat, [1]] # 融合 backbone P4 特征
  - [-1, 2, C3k2, [512, True]] # 13

  # 第二次上采样：P4/16 -> P3/8，用 DySample 改善浅层小目标细节恢复。
  - [-1, 1, DySample, [2, 4, False]]
  - [[-1, 4], 1, Concat, [1]] # 融合 backbone P3 特征
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # 后续自底向上的 PAN 路径保持官方 baseline，保证这次只评估 DySample 的影响。
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
