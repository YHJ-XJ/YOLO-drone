# Ultralytics YOLO26 + DCLDown + DySample object detection model.
# 本配置用于组合消融实验：在不增加 P2 检测头的前提下，同时优化下采样和上采样。
# DCLDown：替换 backbone 中 P2/4 -> P3/8 的 stride=2 Conv，尽量保留小目标细节。
# DySample：替换 neck/head 中两处 nearest 上采样，让跨尺度融合时的特征恢复更加自适应。

nc: 10  # VisDrone 转 YOLO 后的 10 个有效类别
scale: n  # 使用 YOLO26n 规模，与 yolo26n.pt 预训练权重对应
end2end: True  # 保持 YOLO26 官方端到端检测设置
reg_max: 1  # 保持官方 YOLO26 配置，便于和 baseline 公平对比

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]

  # 原官方层：[-1, 1, Conv, [256, 3, 2]]
  # 改进层：DCLDown 同样下采样 2 倍，但加入空间重排、局部卷积和对比池化分支。
  - [-1, 1, DCLDown, [256]] # 3-P3/8

  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # 原官方层：nn.Upsample [None, 2, "nearest"]
  # 改进层：DySample [2, 4, False]
  # 2 表示上采样 2 倍；4 表示分组采样；False 表示先不开启额外动态幅度门控。
  - [-1, 1, DySample, [2, 4, False]]
  - [[-1, 6], 1, Concat, [1]] # 融合 backbone P4 特征
  - [-1, 2, C3k2, [512, True]] # 13

  # 第二处 DySample：P4/16 -> P3/8，是对小目标检测更关键的一次上采样融合。
  - [-1, 1, DySample, [2, 4, False]]
  - [[-1, 4], 1, Concat, [1]] # 融合 backbone P3 特征
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # 自底向上的 PAN 路径保持官方结构，用于观察 DCLDown + DySample 组合本身的收益。
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  # 不额外加入 P2 检测头，保持 Detect(P3, P4, P5)，更适合轻量化边缘部署路线。
  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
