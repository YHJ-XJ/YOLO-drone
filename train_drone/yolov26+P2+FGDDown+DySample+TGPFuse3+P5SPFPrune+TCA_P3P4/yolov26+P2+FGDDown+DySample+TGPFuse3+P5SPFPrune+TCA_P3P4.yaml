# YOLO26n + P2 + FGDDown + DySample + TGPFuse3 + P5SPFPrune + TCA_P3P4
# 目的：在当前 TCA_P3 最优轻量化路线基础上，进一步在 P4 语义检测层加入轻量卷积注意力。
# 单变量变化：相对 TCA_P3，只新增 layer 29 的 P4-TCA，验证 P4 语义增强是否有效。

nc: 10
scale: n
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # P5 -> P4：保留顶层语义下传路径。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # P4 -> P3：用 TGPFuse 替代普通 Concat，增强跨尺度融合的自适应性。
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, TGPFuse, [1, -1, 4, 0.1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8)

  # TCA_P3：增强 P3 小目标局部纹理和上下文响应。
  - [-1, 1, TCA, [256, 4, 0.1]] # 17 (P3/8 attention)

  # P3 -> P2：补充高分辨率小目标检测层。
  - [-1, 1, DySample, [2, 4, False]] # 18
  - [[-1, 2], 1, TGPFuse, [1, -1, 4, 0.1]] # 19
  - [-1, 2, C3k2, [128, True]] # 20 (P2/4)

  # P2 -> P3：FGDDown 保留细粒度空间信息，并用 TGPFuse 回传到 P3。
  - [-1, 1, FGDDown, [128]] # 21
  - [[-1, 17], 1, TGPFuse, [1, 0, 4, 0.1]] # 22
  - [-1, 2, C3k2, [256, True]] # 23 (P3/8)

  # P3 -> P4：保留 P4 检测层。
  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 13], 1, Concat, [1]] # 25
  - [-1, 2, C3k2, [512, True]] # 26 (P4/16)

  # P5SPF：将 P5 深层语义注入 P4，然后删除原 P5 检测分支。
  - [10, 1, DySample, [2, 4, False]] # 27 P5/32 -> P4/16
  - [[26, -1], 1, P5SPF, [4, 0.1]] # 28 P4 semantic preserving fusion

  # TCA_P4：新增实验点，对融合了 P5 语义的 P4 特征再做轻量卷积注意力增强。
  - [-1, 1, TCA, [512, 4, 0.1]] # 29 (P4/16 attention)

  - [[20, 23, 29], 1, Detect, [nc]] # 30 Detect(P2, P3, P4)
