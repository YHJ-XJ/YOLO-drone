# YOLO26n + P2 + FGDDown + DySample + TGPFuse3 + P5Prune_NoSPF
# 目的：关键消融实验。直接删除 P5 检测头，但不加入 P5SPF 语义保留模块。
# 用途：证明 P5SPFPrune 的提升不是简单来自“少一个检测头”，而是来自 P5 语义保留融合。

nc: 10
scale: n
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # P5 -> P4：保留原始自顶向下语义传播。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # P4 -> P3：TGPFuse 替代普通 Concat。
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, TGPFuse, [1, -1, 4, 0.1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8)

  # P3 -> P2：补充高分辨率检测层。
  - [-1, 1, DySample, [2, 4, False]] # 17
  - [[-1, 2], 1, TGPFuse, [1, -1, 4, 0.1]] # 18
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4)

  # P2 -> P3：FGDDown 小目标细节保持下采样。
  - [-1, 1, FGDDown, [128]] # 20
  - [[-1, 16], 1, TGPFuse, [1, 0, 4, 0.1]] # 21
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8)

  # P3 -> P4：保留 P4 检测层。
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16)

  # 消融重点：这里不再建立 P4->P5 检测分支，也不加入 P5SPF。
  - [[19, 22, 25], 1, Detect, [nc]] # 26 Detect(P2, P3, P4)
