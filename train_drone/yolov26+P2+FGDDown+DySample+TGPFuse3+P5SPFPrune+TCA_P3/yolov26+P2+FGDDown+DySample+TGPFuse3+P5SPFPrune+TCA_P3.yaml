# YOLO26n + P2 + FGDDown + DySample + TGPFuse3 + P5SPFPrune + TCA_P3
# 目标：在当前最终模型基础上，只在 P4->P3 融合后的 P3 特征处加入轻量卷积注意力 TCA。
# 实验定位：验证 Neck 中 P3 融合特征的局部纹理/上下文卷积注意力是否能进一步提升无人机小目标检测精度。

nc: 10
scale: n
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # P5 -> P4：保留顶层语义下传路径。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # P4 -> P3：小目标相关融合点 1。
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, TGPFuse, [1, -1, 4, 0.1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8)

  # TCA_P3：只在 P3 融合特征处加入轻量卷积注意力，先做单变量实验。
  - [-1, 1, TCA, [256, 4, 0.1]] # 17 (P3/8 attention)

  # P3 -> P2：小目标相关融合点 2。
  - [-1, 1, DySample, [2, 4, False]] # 18
  - [[-1, 2], 1, TGPFuse, [1, -1, 4, 0.1]] # 19
  - [-1, 2, C3k2, [128, True]] # 20 (P2/4)

  # P2 -> P3：小目标细节回传融合点 3，这里使用 TCA 后的 P3 特征作为融合参照。
  - [-1, 1, FGDDown, [128]] # 21
  - [[-1, 17], 1, TGPFuse, [1, 0, 4, 0.1]] # 22
  - [-1, 2, C3k2, [256, True]] # 23 (P3/8)

  # P3 -> P4：保留 P4 检测层。
  - [-1, 1, Conv, [256, 3, 2]] # 24
  - [[-1, 13], 1, Concat, [1]] # 25
  - [-1, 2, C3k2, [512, True]] # 26 (P4/16)

  # P5SPF：把 P5 语义轻量注入 P4，然后删除原 P5 检测分支。
  - [10, 1, DySample, [2, 4, False]] # 27 P5/32 -> P4/16
  - [[26, -1], 1, P5SPF, [4, 0.1]] # 28

  - [[20, 23, 28], 1, Detect, [nc]] # 29 Detect(P2, P3, P4)
