# YOLO26 + P2 + FGDDown + DySample + TGPFuse3 + P5SPFPrune
# 目标：删除 P5 检测头前，先把 P5 深层语义轻量注入 P4，形成语义保留式结构剪枝。
# 创新点：Semantic Preserving P5 Pruning。最终仍保持 P2/P3/P4 三个检测层，兼顾小目标检测和边缘轻量化。

nc: 10
scale: n
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # P5 -> P4：保留顶层语义下传路径。
  - [-1, 1, DySample, [2, 4, False]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  # P4 -> P3：小目标相关融合点 1。
  - [-1, 1, DySample, [2, 4, False]] # 14
  - [[-1, 4], 1, TGPFuse, [1, -1, 4, 0.1]] # 15
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  # P3 -> P2：小目标相关融合点 2。
  - [-1, 1, DySample, [2, 4, False]] # 17
  - [[-1, 2], 1, TGPFuse, [1, -1, 4, 0.1]] # 18
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  # P2 -> P3：小目标细节回传融合点 3。
  - [-1, 1, FGDDown, [128]] # 20
  - [[-1, 16], 1, TGPFuse, [1, 0, 4, 0.1]] # 21
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  # P3 -> P4：保留 P4 检测层。
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  # P5SPF：把 P5 语义轻量注入 P4，然后删除原 P5 检测分支。
  # 这里不再执行 P4->P5 的下采样检测路径，因此最终 Detect 只有 P2/P3/P4 三层。
  - [10, 1, DySample, [2, 4, False]] # 26 P5/32 -> P4/16
  - [[25, -1], 1, P5SPF, [4, 0.1]] # 27 Semantic Preserving P5 Fusion

  - [[19, 22, 27], 1, Detect, [nc]] # 28 Detect(P2, P3, P4)
